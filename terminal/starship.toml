# Um prompt só, em todo terminal: o PowerShell 5.1 e o 7 leem este arquivo de D:\Perfil\Home\.config\starship.toml
# (o profile.ps1 aponta STARSHIP_CONFIG para lá) e o zsh do Debian lê o mesmo arquivo por /mnt/d (o zshrc aponta).
# Paleta Catppuccin Mocha, a mesma do Windows Terminal e do ghostty do dotfiles. Fonte: JetBrainsMono Nerd Font.

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$cmd_duration\
$line_break\
$character"""

add_newline = true
palette = "catppuccin_mocha"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold mauve"
format = " [$symbol$branch]($style)"

[git_status]
style = "peach"
format = " [$all_status$ahead_behind]($style)"

[nodejs]
symbol = " "
style = "green"
format = " [$symbol($version)]($style)"

[python]
symbol = " "
style = "yellow"
format = " [$symbol($version)]($style)"

[cmd_duration]
min_time = 2000
style = "overlay1"
format = " [$duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

